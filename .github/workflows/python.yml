name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Build wheel
        run: python -m build

      - name: Install wheel into clean venv and run CLI
        shell: bash
        run: |
          python -m venv .venv-wheel
          if [ -d .venv-wheel/Scripts ]; then PY=.venv-wheel/Scripts/python; else PY=.venv-wheel/bin/python; fi
          "$PY" -m pip install --no-deps dist/*.whl
          "$PY" -m kzp_lab06.cli data/vet_visits.csv reports/wheel-summary.txt
          set +e
          "$PY" -m kzp_lab06.cli data/broken.csv reports/wheel-broken.txt
          code=$?
          set -e
          echo "Код завершення для пошкодженого CSV: $code"
          test "$code" -eq 2

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: kzp-vet-report-${{ matrix.os }}-${{ github.run_number }}
          path: |
            python/dist/*.whl
            python/reports/*.txt
          if-no-files-found: error
