name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show CI build number
        run: echo "CI build ${{ github.run_number }}"

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

      - name: Package on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B -DskipTests package

      - name: Package on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -DskipTests package

      - name: Run JAR (export and round-trip)
        shell: bash
        run: |
          JAR=$(ls target/lab01-*.jar | grep -v original | grep -v shaded | head -n 1)
          java -jar "$JAR" | tee target/run-output.txt
          grep -q "Round-trip: true" target/run-output.txt

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/*.jar
          if-no-files-found: error

      - name: Upload CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: csv-${{ matrix.os }}-${{ github.run_number }}
          path: |
            target/data/*.csv
            target/run-output.txt
          if-no-files-found: error
